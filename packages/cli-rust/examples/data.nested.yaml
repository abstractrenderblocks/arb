tool:
  name: repotool
  bin: repotool
  version: 0.1.0
  license: MIT
  description: A tiny CLI that demonstrates nested subcommands (arb cli-rust package).
  repo_url: https://example.invalid

global_flags:
  - long: verbose
    ident: verbose
    help: Enable verbose logging.
    short: v

commands:
  - name: remote
    ident: Remote
    summary: Manage remote endpoints.
    subcommands:
      - name: add
        ident: Add
        summary: Add a remote.
        args:
          - name: NAME
            ident: name
            help: Remote name
          - name: URL
            ident: url
            help: Remote URL
      - name: list
        ident: List
        summary: List remotes.

  - name: status
    ident: Status
    summary: Show current status.
